[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "resume-tailor"
version = "1.0.0"
description = "Tailor a LaTeX resume (EN + TR) to a job posting, truthfully."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Every runtime dependency is a supply-chain risk in a tool that handles personal data.
# Keep this list short and justify additions in the commit message (CLAUDE.md §5).
dependencies = [
  "anthropic>=1.0,<2",
  "google-genai>=1.30,<2",
  "pydantic>=2.8,<3",
  "pypdf>=5.0,<7",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
tailor = "resume_tailor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_tailor"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "resume_tailor/_prompts"
"sample-data" = "resume_tailor/_sample"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Turkish text and typographic dashes are intended

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["resume_tailor"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: needs pdflatex",
  "live: calls a real LLM; runs only with RT_LIVE_SMOKE=1",
]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
