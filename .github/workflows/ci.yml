name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy
      - uses: ./.github/actions/setup-tinytex
      # conftest.py blocks sockets and strips API keys: no test can reach a live LLM.
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The CSP is the guarantee that the token only reaches api.github.com.
      - name: Built page keeps its CSP
        run: grep -q "connect-src https://api.github.com;" dist/index.html

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Personal-data scan
        env:
          # Newline-separated contact strings, stored as a secret so they never appear here.
          RT_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: python scripts/privacy_scan.py
      # The whole history on every push. gitleaks-action scans only the pushed range and
      # fails outright when that range starts at the root commit (`<root>^` does not exist).
      # --user: git refuses a checkout owned by another uid ("dubious ownership").
      - name: Secret scan
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          zricethezav/gitleaks:v8.24.3 git /repo --redact --verbose --exit-code 1
