name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy
      - uses: ./.github/actions/setup-tinytex
      # conftest.py blocks sockets and strips API keys: no test can reach a live LLM.
      - run: pytest

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Personal-data scan
        env:
          # Newline-separated contact strings, stored as a secret so they never appear here.
          RT_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: python scripts/privacy_scan.py
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
