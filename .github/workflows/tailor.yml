# Reusable workflow: builds every pending request in the caller's private data repo.
#
# The caller is the workflow `tailor init-data-repo` writes into resume-data. Each pipeline
# stage is its own step, because step status is what the Actions API exposes: the web app
# reads it to show queued → analyzing → tailoring → compiling → done (docs/PLAN.md §2.9).
# The step names below are part of that contract; rename them only together with the web app.
name: tailor (reusable)

on:
  workflow_call:
    inputs:
      tool-repo:
        description: OWNER/NAME of this repo (a called workflow cannot see its own repo).
        type: string
        default: bedirhankaraahmetli/resume-tailor
      tool-ref:
        description: Commit or tag of the tool to run. Pin the same ref as in `uses:`.
        type: string
        required: true
      request:
        description: One request file to build (even if already built). Empty = every pending one.
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      GEMINI_API_KEY:
        required: false

permissions:
  contents: write

jobs:
  tailor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # `secrets` cannot appear in a step's `if:`, so expose only whether it is set.
      HAS_CLAUDE_CODE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out data
        uses: actions/checkout@v4
        with:
          path: data
          # The branch tip, not the triggering commit: a run that waited in the concurrency
          # queue must see the results the previous run committed, or it rebuilds them.
          ref: ${{ github.ref_name }}

      - name: Check out tool
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool-repo }}
          ref: ${{ inputs.tool-ref }}
          path: tool
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tool/pyproject.toml

      - name: Install tool
        run: pip install --disable-pip-version-check -q ./tool

      - name: Queue requests
        id: queue
        env:
          REQUEST: ${{ inputs.request }}
        run: |
          echo "WORK=$RUNNER_TEMP/rt-work" >> "$GITHUB_ENV"
          args=()
          [ -n "$REQUEST" ] && args+=(--request "$REQUEST")
          tailor request start --data-dir data --work "$RUNNER_TEMP/rt-work" "${args[@]}"

      - name: Set up TinyTeX
        if: steps.queue.outputs.jobs != '0'
        uses: ./tool/.github/actions/setup-tinytex

      - name: Install Claude Code (fallback provider)
        if: steps.queue.outputs.jobs != '0' && env.HAS_CLAUDE_CODE == 'true'
        run: npm install -g --silent @anthropic-ai/claude-code

      # Each stage skips requests an earlier stage failed, and fails (red) if one of its own
      # requests failed. `!cancelled()` lets later stages still serve the other requests.
      - name: Analyze posting
        if: ${{ !cancelled() && steps.queue.outputs.jobs != '0' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: tailor request analyze --data-dir data --work "$WORK"

      - name: Tailor
        if: ${{ !cancelled() && steps.queue.outputs.jobs != '0' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: tailor request tailor --data-dir data --work "$WORK"

      - name: Compile and check
        if: ${{ !cancelled() && steps.queue.outputs.jobs != '0' }}
        run: tailor request compile --data-dir data --work "$WORK"

      # Always runs, so a failed or timed-out request still gets results/<id>.json and is
      # not picked up (and paid for) again by the next run. With nothing queued it still
      # refreshes presets/status.json, which the web app reads.
      - name: Publish
        if: ${{ always() && steps.queue.outcome == 'success' }}
        working-directory: data
        run: |
          tailor request finish --data-dir . --work "$WORK" --message-file "$RUNNER_TEMP/msg.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          # Commits pushed with GITHUB_TOKEN never trigger workflows, and the trigger is
          # path-filtered to requests/**: this commit cannot start another run.
          git commit -q -F "$RUNNER_TEMP/msg.txt"
          for i in 1 2 3 4 5; do
            git pull -q --rebase && git push -q && exit 0
            echo "push attempt $i failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done
          echo "::error::could not push the results after 5 attempts"
          exit 1
