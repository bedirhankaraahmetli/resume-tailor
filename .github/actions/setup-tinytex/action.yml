name: Set up TinyTeX (pdfLaTeX)
description: >
  Installs TinyTeX with exactly the packages the resume template needs, cached between
  runs. pdfLaTeX only: the template relies on pdfTeX primitives for a clean ATS text layer.
runs:
  using: composite
  steps:
    # hashFiles() only sees the caller's workspace layout, and the reusable workflow checks
    # this repo out into a subfolder. Hash the package list from the action's own path.
    - name: Cache key
      id: key
      shell: bash
      run: echo "hash=$(sha256sum "${{ github.action_path }}/packages.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Cache TinyTeX
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.TinyTeX
        key: tinytex-v1-${{ runner.os }}-${{ steps.key.outputs.hash }}
    - name: Install TinyTeX
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL https://yihui.org/tinytex/install-bin-unix.sh | sh
        ~/.TinyTeX/bin/*/tlmgr install $(grep -v '^#' "${{ github.action_path }}/packages.txt" | xargs)
    - name: Add TinyTeX to PATH
      shell: bash
      run: echo "$(echo ~/.TinyTeX/bin/*)" >> "$GITHUB_PATH"
